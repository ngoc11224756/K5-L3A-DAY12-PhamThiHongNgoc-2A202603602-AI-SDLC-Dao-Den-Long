<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng — Đêm 1: Đảo Bến</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <div id="hud">
        <div class="hud-top">
          <div class="hud-card" id="hud-flames">
            <span class="label">Ngọn lửa</span>
            <span class="value" id="val-flames">🔥🔥🔥</span>
          </div>
          <div class="hud-card" id="hud-motes">
            <span class="label">Đom đóm</span>
            <span class="value" id="val-motes">0 / 5</span>
          </div>
          <div class="hud-card" id="hud-lanterns">
            <span class="label">Đèn Lồng Lớn</span>
            <span class="value" id="val-lanterns">0 / 5</span>
          </div>
          <div class="hud-card" id="hud-time">
            <span class="label">Thời gian</span>
            <span class="value" id="val-time">04:00</span>
          </div>
          <div class="hud-card" id="hud-score">
            <span class="label">Điểm</span>
            <span class="value" id="val-score">0</span>
          </div>
        </div>

        <div id="hud-prompt" class="hidden"></div>

        <div class="hud-bottom">
          <div class="controls-bar">
            <span><b>WASD</b> Di chuyển</span>
            <span><b>← / →</b> hoặc kéo chuột: Xoay camera</span>
            <span><b>Space</b> Nhảy</span>
            <span><b>E</b> Nạp đèn</span>
            <span><b>Q / F</b> Tỏa sáng (<span id="val-pulse">Sẵn sàng</span>)</span>
            <span><b>M</b> <span id="val-audio">Âm thanh: Bật</span></span>
          </div>
        </div>
      </div>

      <div id="overlay" class="hidden">
        <div class="overlay-card">
          <h1 id="overlay-title">Đảo Đèn Lồng</h1>
          <p id="overlay-subtitle"></p>
          <div class="overlay-stats" id="overlay-stats"></div>
          <button id="btn-restart" type="button">Chơi lại Đêm 1</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
